name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and type-check
        run: bun run lint

      - name: Unit tests
        run: bun run test

      # wxt zip builds each browser once, leaving the unpacked build in .output/ for the checks below.
      - name: Build and package both browsers
        run: |
          bun run zip:chrome
          bun run zip:firefox

      - name: Lint the Firefox package with Mozilla's validator
        run: bunx web-ext lint -s .output/firefox-mv3

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Load the Chrome build in Chromium
        run: |
          bunx playwright install --with-deps chromium
          xvfb-run --auto-servernum node scripts/load-check.ts

      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: .output/*.zip
          if-no-files-found: error
          # WXT writes to .output/, which upload-artifact skips as hidden unless told otherwise.
          include-hidden-files: true
