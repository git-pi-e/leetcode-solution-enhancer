name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and type-check
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build and lint the Firefox package
        run: bun run build:firefox

      - name: Build the Chrome package and load it in Chromium
        run: |
          bun run build:chrome
          bunx playwright install --with-deps chromium
          xvfb-run --auto-servernum node scripts/load-check.ts

      - name: Package for both stores
        run: |
          bun run zip:chrome
          bun run zip:firefox

      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: .output/*.zip
          if-no-files-found: error
